<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nevark Technologies • Coming Soon</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .card {
      padding: 3rem 2.5rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      max-width: 420px;
      width: 90%;
    }

    h1 {
      letter-spacing: 0.3em;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }

    p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #6366f1;
      margin: 1.5rem auto;
      border-radius: 999px;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>NEVARK</h1>
    <div class="divider"></div>
    <p>
      We’re building something powerful.<br />
      Our website is launching soon.
    </p>
    <footer>
      © 2026 Nevark Technologies LLP
    </footer>
  </div>
</body>
</html>
